<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Box - My Recipes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
              <div class="logo-icon">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="3" y="6" width="18" height="12" rx="2" stroke-width="2"/>
        <path stroke-linecap="round" stroke-width="2" d="M3 10h18M7 14h2m4 0h2"/>
        <path stroke-linecap="round" stroke-width="2" d="M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2"/>
    </svg>
            </div iv>
                <div class="logo-text">
                    <h2>Recipe Box</h2>
                    <p>Welcome, <span id="username"></span></p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" id="addRecipeBtn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    Add Recipe
                </button>
                <button class="btn btn-secondary" id="logoutBtn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Recipe Form -->
        <div id="recipeForm" class="form-card hidden">
            <div class="form-header">
                <h2 id="formTitle">Add New Recipe</h2>
                <button class="close-btn" id="closeFormBtn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Recipe Name *</label>
                    <input type="text" id="recipeName" placeholder="Delicious Pasta">
                </div>
                <div class="form-group">
                    <label>Recipe Image</label>
                    <input type="file" id="recipeImage" accept="image/*">
                </div>
            </div>

            <div id="imagePreview" class="image-preview hidden"></div>

            <div class="form-group">
                <label>Description *</label>
                <textarea id="recipeDescription" placeholder="A brief description of your recipe..." rows="3"></textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Servings *</label>
                    <input type="number" id="recipeServings" min="1" placeholder="4">
                </div>
                <div class="form-group">
                    <label>Prep Time (minutes) *</label>
                    <input type="number" id="recipePrepTime" min="1" placeholder="30">
                </div>
            </div>

            <div class="array-section">
                <div class="array-header">
                    <label>Ingredients</label>
                    <button class="add-item-btn" id="addIngredientBtn">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        Add Ingredient
                    </button>
                </div>
                <div id="ingredientsList"></div>
            </div>

            <div class="array-section">
                <div class="array-header">
                    <label>Steps</label>
                    <button class="add-item-btn" id="addStepBtn">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        Add Step
                    </button>
                </div>
                <div id="stepsList"></div>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" id="saveRecipeBtn">
                    <span id="saveBtnText">Save Recipe</span>
                </button>
                <button class="btn btn-secondary" id="cancelFormBtn">Cancel</button>
            </div>
        </div>

        <!-- Recipes List -->
        <div id="recipesList"></div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <div class="empty-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
            </div>
            <h2>No Recipes Yet</h2>
            <p>Start building your personal recipe collection</p>
            <button class="btn btn-primary" id="addFirstRecipeBtn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Add Your First Recipe
            </button>
        </div>
    </div>

    <script src="recipe.js"></script>
</body>
</html>
