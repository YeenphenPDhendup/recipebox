<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Recipe Box</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .admin-icon-wrapper {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        }
        
        .btn-admin-primary {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            width: 100%;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
        
        .btn-admin-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.4);
        }
        
        .admin-notice {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <span class="admin-badge">ADMIN ACCESS</span>
                <div class="auth-icon admin-icon-wrapper">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                </div>
                <h1>Admin Panel</h1>
                <p class="subtitle">Secure administrative access</p>
            </div>

            <div class="admin-notice">
                <strong>⚠️ Authorized Personnel Only</strong><br>
                All login attempts are logged and monitored.
            </div>

            <div id="loginForm">
                <div class="form-group">
                    <label>Admin Username or Email</label>
                    <input type="text" id="adminIdentifier" placeholder="Enter admin credentials" required autofocus>
                    <span class="error-message" id="identifierError"></span>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter admin password" required>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button class="btn btn-admin-primary" onclick="handleAdminLogin()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    Secure Login
                </button>

                <div class="auth-footer">
                    <p>Not an admin? <a href="login.html">User Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="admin-auth.js"></script>
</body>
</html>
